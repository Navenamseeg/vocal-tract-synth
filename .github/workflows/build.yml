name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-${{ runner.os }}

      - name: "Configure (universal: Apple Silicon and Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target VocalTractSynth_VST3 VocalTractSynth_AU VocalTractSynth_Standalone -- -quiet

      - name: Sign locally (ad-hoc) and package
        run: |
          set -e
          OUT=build/VocalTractSynth_artefacts/Release
          mkdir -p dist
          cp -R "$OUT/VST3/Vocal Tract Synth.vst3" dist/
          cp -R "$OUT/AU/Vocal Tract Synth.component" dist/
          cp -R "$OUT/Standalone/Vocal Tract Synth.app" dist/
          for f in dist/*; do codesign --force --deep -s - "$f"; done
          cp INSTALL.txt dist/
          cd dist && zip -qry "../Vocal-Tract-Synth-mac.zip" .

      - name: Validate (Apple auval and pluginval)
        run: |
          note() { msg=$(printf '%s' "$2" | tail -c 3000 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'); echo "::$1 title=$3::$msg"; }
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/Vocal Tract Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          if auval -v aumu Vtr1 Egsm > auval.log 2>&1; then note notice "$(tail -n 6 auval.log)" "auval passed"; else note error "$(tail -n 40 auval.log)" "auval failed"; fi
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip && unzip -q pv.zip
          if ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --timeout-ms 120000 --validate "dist/Vocal Tract Synth.vst3" > pv.log 2>&1; then note notice "$(grep -E 'Starting tests|SUCCESS|Testing|ALL TESTS' pv.log | tail -n 30)" "pluginval passed"; else note error "$(grep -vE '^\s*$' pv.log | tail -n 60)" "pluginval failed"; fi
          cat auval.log pv.log

      - uses: actions/upload-artifact@v4
        with:
          name: Vocal-Tract-Synth-mac
          path: Vocal-Tract-Synth-mac.zip

      - name: Publish as the "latest" download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Vocal-Tract-Synth-mac.zip --title "Vocal Tract Synth (latest Mac build)" --notes "Built from ${GITHUB_SHA::7}. Download Vocal-Tract-Synth-mac.zip below and follow INSTALL.txt inside." --target "$GITHUB_SHA"
