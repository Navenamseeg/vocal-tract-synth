name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-${{ runner.os }}

      - name: Configure (universal: Apple Silicon + Intel)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target VocalTractSynth_VST3 VocalTractSynth_AU VocalTractSynth_Standalone -- -quiet

      - name: Sign locally (ad-hoc) and package
        run: |
          set -e
          OUT=build/VocalTractSynth_artefacts/Release
          mkdir -p dist
          cp -R "$OUT/VST3/Vocal Tract Synth.vst3" dist/
          cp -R "$OUT/AU/Vocal Tract Synth.component" dist/
          cp -R "$OUT/Standalone/Vocal Tract Synth.app" dist/
          for f in dist/*; do codesign --force --deep -s - "$f"; done
          cp INSTALL.txt dist/
          cd dist && zip -qry "../Vocal-Tract-Synth-mac.zip" .

      - name: Check the Audio Unit loads
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/Vocal Tract Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Vtr1 Egsm || echo "auval did not pass (see log above)"

      - uses: actions/upload-artifact@v4
        with:
          name: Vocal-Tract-Synth-mac
          path: Vocal-Tract-Synth-mac.zip
